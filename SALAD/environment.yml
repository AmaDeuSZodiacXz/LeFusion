name: neuralsynth
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  # Python version
  - python=3.10
  
  # PyTorch and related
  - pytorch=2.0.1
  - torchvision=0.15.2
  - torchaudio=2.0.2
  - pytorch-cuda=11.8
  
  # Scientific computing
  - numpy=1.24.3
  - scipy=1.10.1
  - pandas=2.0.3
  - matplotlib=3.7.1
  
  # Progress bars and utilities
  - tqdm
  - ipython
  
  # Pip packages
  - pip
  - pip:
    # Medical imaging
    - monai==1.2.0
    - nibabel==5.1.0
    - SimpleITK==2.2.1
    - scikit-image==0.21.0
    
    # Diffusion models (compatible versions)
    - diffusers==0.21.4
    - transformers==4.30.0
    - accelerate==0.20.3
    
    # Deep learning utilities
    - einops==0.6.1
    - omegaconf==2.3.0
    
    # Image processing
    - opencv-python==4.8.0.74
    - Pillow==10.0.0
    
    # Logging and visualization
    - tensorboard==2.13.0
    - wandb
    
    # File I/O
    - h5py==3.9.0
    - pyyaml==6.0.1
    
    # Optional: Development tools
    - jupyter
    - jupyterlab
    - ipykernel
    - pytest
    - black
    - flake8