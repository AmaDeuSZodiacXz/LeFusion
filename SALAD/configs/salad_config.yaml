# SALAD Configuration File
model:
  name: SALAD
  channels: 128
  attention_resolutions: [16, 8]
  num_res_blocks: 3
  dropout: 0.1
  
inference:
  ddim_steps: 50
  batch_size: 8
  guidance_scale: 1.0
  
training:
  learning_rate: 1e-4
  batch_size: 32
  num_epochs: 100
  
data:
  image_size: [256, 256]
  num_classes: 5
