# LeFusion Paper Evaluation Configuration
# Based on Tables 1 and 2 from the paper

datasets:
  lidc:
    name: "LIDC-IDRI"
    normal_dir: "../data/LIDC/Normal/Image"
    pathological_dir: "../data/LIDC/Pathological"
    test_file: "../data/LIDC/Pathological/test.txt"
    real_data_dir: "../utility_training_resources/datasets/LIDC_real"
    
  emidec:
    name: "EMIDEC"
    normal_dir: "../data/EMIDEC/Normal"
    pathological_dir: "../data/EMIDEC/Pathological"
    real_data_dir: "../utility_training_resources/datasets/EMIDEC_real"

# Methods from the paper
methods:
  baseline:
    description: "Training with real pathological cases only (P)"
    requires_synthetic: false
    
  lefusion:
    description: "LeFusion base model"
    requires_synthetic: true
    synthetic_types: ["P+P'"]
    
  lefusion_h:
    description: "LeFusion with histogram conditioning"
    requires_synthetic: true
    synthetic_types: ["P+P'", "P+N'"]
    
  lefusion_h_diffmask:
    description: "LeFusion-H enhanced with DiffMask"
    requires_synthetic: true
    synthetic_types: ["P+N'", "P+N''", "P+P'+N''"]

# Model weights configuration
model_weights:
  pretrained:
    lefusion:
      lidc: "../LeFusion/LeFusion_Model/LIDC/lidc.pt"
      emidec: "../LeFusion/LeFusion_Model/EMIDEC/emidec.pt"
    diffmask:
      lidc: "../DiffMask/DiffMask_Model/diffmask.pt"
      
  from_scratch:
    lefusion:
      lidc: "../LeFusion/LeFusion_Model/LIDC/model-50.pt"
      emidec: "../LeFusion/LeFusion_Model/EMIDEC/model-50.pt"
    diffmask:
      lidc: "../DiffMask/DiffMask_Model/model-80.pt"

# Segmentation models from the paper
segmentation_models:
  nnunet:
    name: "nnU-Net"
    year: 2021
    
  swinunetr:
    name: "SwinUNETR"
    year: 2021

# Training settings
training:
  max_epochs: 200
  batch_size: 1
  learning_rate: 0.0004
  optimizer: "adamw"
  workers: 1
  cache_rate: 0.1
  val_every: 200
  
# Evaluation metrics
evaluation:
  metrics:
    - dice
    - nsd
  nsd_tolerance: 1.0  # mm (matching paper methodology)
  
# Output directories
output:
  synthetic_data: "synthetic_data"
  trained_models: "trained_models"
  evaluation_results: "evaluation_results"
  logs: "logs" 